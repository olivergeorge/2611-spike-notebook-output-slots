<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Rainfall dashboard</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..700&display=swap">
  <style>
    /* Condense: ink on a drafting sheet, ruled square cells, one teal. */
    :root { --ink: #0C2B33; --ink-2: #3A535B; --sheet: #F5F8F7; --teal: #009B8F; }
    body { font: 17px/1.55 Archivo, "Helvetica Neue", Arial, sans-serif; font-variant-numeric: tabular-nums lining-nums;
           color: var(--ink); background: var(--sheet); margin: 2rem; }
    h1 { font-size: 46px; line-height: 1.07; letter-spacing: -0.02em; margin: 0 0 1.5rem; }
    h2 { font: 600 12.5px/1.2 Archivo, sans-serif; font-stretch: 78%; letter-spacing: 0.06em; text-transform: uppercase;
         color: var(--ink-2); margin: 0 0 1rem; }
    .dashboard { display: grid; grid-template-columns: 16rem 1fr; max-width: 64rem; border: 1.5px solid var(--ink); }
    aside, section { background: #fff; padding: 20px 24px; }
    aside { border-right: 1.5px solid var(--ink); }
    input { accent-color: var(--teal); }
  </style>
</head>
<body>
  <h1>Rainfall dashboard</h1>
  <main class="dashboard">
    <aside>
      <h2>Controls</h2>
      <div data-output="thresholdInput"></div>
      <div data-output="summary"></div>
    </aside>
    <section>
      <h2>By month</h2>
      <div data-output="chart"></div>
    </section>
  </main>
  <script type="module" src="./slots.js"></script>
</body>
</html>
