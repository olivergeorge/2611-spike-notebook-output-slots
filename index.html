<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Rainfall dashboard</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..700&display=swap">
  <style>
    /* Condense: ink on a drafting sheet, ruled square cells, one teal. */
    body { font: 17px/1.5 Archivo, sans-serif; color: #0C2B33; background: #F5F8F7; margin: 2rem; accent-color: #009B8F; }
    h2 { margin-top: 0; font-size: 12.5px; font-stretch: 78%; letter-spacing: 0.06em; text-transform: uppercase; color: #3A535B; }
    main { display: grid; grid-template-columns: 16rem 1fr; max-width: 64rem; border: 1.5px solid; }
    aside, section { background: #fff; padding: 16px 24px 20px; }
    aside { border-right: 1.5px solid; }
  </style>
</head>
<body>
  <h1>Rainfall dashboard</h1>
  <main>
    <aside>
      <h2>Controls</h2>
      <div data-output="thresholdInput"></div>
      <div data-output="summary"></div>
    </aside>
    <section>
      <h2>By month</h2>
      <div data-output="chart"></div>
    </section>
  </main>
  <script type="module" src="./slots.js"></script>
</body>
</html>
